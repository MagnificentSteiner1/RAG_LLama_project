version: "3.9"

services: #dva containera, api i ollama
  api:
    build: .
    container_name: rag_api
    ports:
      - "8000:8000"
    volumes: #pravi docker volumes, ne pristupa folderu projecta nego ima svoju odvojenu putanju gde ih cuva
      - chroma_data:/app/Database
      - documents_data:/app/Documents

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      # persist downloaded models
      - ollama_data:/root/.ollama

    gpus: all


volumes:
  chroma_data:
  documents_data:
  ollama_data: